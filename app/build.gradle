plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

base { archivesName = "UnkX-Mod-Builder-1.8.9" }

android {
    namespace 'com.unkx.modbuilder'
    compileSdk 34
    defaultConfig {
        applicationId 'com.unkx.modbuilder'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '2.0'
        ndk { abiFilters "arm64-v8a", "x86_64" }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = "3.13"
        buildPython "python3"
    }
}
